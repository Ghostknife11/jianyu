name: Reference checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source tree and Git history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact=100 .
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --log-opts='--all' .

  public-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node scripts/check.mjs
      - name: Test public contracts
        run: node --test "tests/**/*.test.js"

  nas-web-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Test the NAS web server and proxy rules
        run: node --test "tests/nas-web/*.test.js"
      - name: Build the self-hosted image
        run: |
          # Pull the pinned base digest on its own before building. Registries
          # answer shared build-farm addresses with rate limits and transient 5xx,
          # and neither says anything about this image, so a registry hiccup should
          # not read as a broken build. Pulling first also means a genuine Dockerfile
          # defect still fails on the first attempt, with nothing left to download.
          base="$(awk '/^FROM /{print $2}' apps/jianyu-web-nas/Dockerfile)"
          attempt=1
          until docker pull "$base"; do
            if [ "$attempt" -ge 6 ]; then
              echo "could not pull $base after $attempt attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "pull attempt $attempt failed; retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          docker build --file apps/jianyu-web-nas/Dockerfile --tag jianyu-nas-web:ci .
      - name: Start the container on a scratch volume
        run: |
          docker volume create jianyu-nas-data
          docker run --detach --name jianyu-nas-ci --publish 8080:8080 --volume jianyu-nas-data:/data jianyu-nas-web:ci
      - name: Wait for the container health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "the container never reported healthy" >&2
          docker logs jianyu-nas-ci || true
          exit 1
      - name: Check the served client and its security headers
        run: |
          curl --fail --silent --show-error --head http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          curl --fail --silent --show-error http://127.0.0.1:8080/packages/provider-sdk/src/index.js | grep -q 'assertOpaqueSyncObjectId'
          curl --fail --silent --show-error --head http://127.0.0.1:8080/packages/provider-sdk/src/index.js | grep -qi '^x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/../SECURITY.md)" != "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/households/me)" = "401"
      - name: Verify the data volume holds no family plaintext
        run: |
          unexpected="$(docker exec jianyu-nas-ci sh -c 'ls -A /data | grep -v -e ^households$ -e ^sessions$ -e ^objects$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected entries in /data: $unexpected" >&2
            exit 1
          fi

  android-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Gradle wrapper JAR
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  apps/jianyu-android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --status
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0
        with:
          packages: platform-tools
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, build, and lint the native app
        working-directory: apps/jianyu-android
        run: bash ./gradlew test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:assembleRelease :app:lintRelease --no-daemon --console=plain
